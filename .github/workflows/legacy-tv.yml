name: Older Samsung TV app
on:
  pull_request:
    paths: ["apps/legacy-tv/**", ".github/workflows/legacy-tv.yml"]
  push:
    branches: [main]
    paths: ["apps/legacy-tv/**", ".github/workflows/legacy-tv.yml"]
permissions:
  contents: read
concurrency:
  group: legacy-tv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/legacy-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/legacy-tv/package-lock.json
      - run: npm ci
      - run: npm test
