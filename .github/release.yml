# Categories for GitHub's generated release notes.
changelog:
  exclude:
    labels: ["duplicate", "wontfix", "dependencies"]
  categories:
    - title: New features
      labels: ["enhancement"]
    - title: Fixes
      labels: ["bug", "playback"]
    - title: Accessibility
      labels: ["accessibility"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
