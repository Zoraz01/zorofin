<div id="zoro-tv-review" class="viz-carousel viz-dotted-background" aria-label="Apple TV player design comparison">
  <section data-variant="Apple-inspired" aria-label="Apple-inspired Zorofin player concept"><div class="zt-stage" data-design="native"></div></section>
  <section data-variant="Prepared Zorofin controls" aria-label="Zorofin controls prepared in the release branch" hidden><div class="zt-stage" data-design="prepared"></div></section>
  <section data-variant="Apple reference" aria-label="Official Apple TV app illustration" hidden><div class="zt-stage zt-reference"><div class="zt-reference-label">APPLE TV APP · OFFICIAL APPLE ILLUSTRATION</div><img class="zt-apple-image" alt="Apple TV app playback controls: title above the timeline, subtitle, audio and Picture in Picture controls on the right, and information tabs below." src="https://help.apple.com/assets/6A0B92AC55AFD81B2E01CA2A/6A0B92B055AFD81B2E01CA30/en_US/cf29160a6f35bce837aad5933f3210f7.png"><a href="https://support.apple.com/en-ie/guide/tv/atvb7944597f/27/tvos/27" target="_blank" rel="noopener">Apple TV playback guide</a></div></section>
</div>
<style>
#zoro-tv-review{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--zt-green:#6ce39d;--zt-white:#f8faf9;--zt-muted:#bec9c5;color:var(--zt-white)}
#zoro-tv-review *{box-sizing:border-box}
#zoro-tv-review .zt-stage{padding:12px 0 8px;min-height:488px}
#zoro-tv-review .zt-tv{position:relative;width:100%;aspect-ratio:16/9;min-height:408px;background:#071318;border-radius:14px;overflow:hidden;isolation:isolate}
#zoro-tv-review .zt-scene{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 62% 70%,#386262,transparent 52%),linear-gradient(125deg,#0a202b,#163b46 52%,#061c28)}
#zoro-tv-review .zt-scene:before{content:"";position:absolute;right:9%;top:-28%;width:63%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 34% 76%,#b3c9bc,#66928f 29%,#355967 52%,#102e41 71%);box-shadow:0 0 65px #b3dec620}
#zoro-tv-review .zt-scene:after{content:"";position:absolute;inset:58% -15% -30%;border-radius:50%;transform:rotate(-9deg);background:linear-gradient(#142d32,#030b12 75%);box-shadow:0 -2px 28px #8cd6c035}
#zoro-tv-review .zt-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#0007,transparent 27%,transparent 42%,#000e)}
#zoro-tv-review button,#zoro-tv-review input{font:inherit;color:inherit}
#zoro-tv-review button{border:0;cursor:pointer;min-height:44px;min-width:44px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:28px;transition:background .16s}
#zoro-tv-review button:hover{background:#ffffff1c}
#zoro-tv-review button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#zoro-tv-review .zt-icon svg{width:22px!important;height:22px!important;stroke-width:1.7}
#zoro-tv-review .zt-header{position:absolute;top:18px;left:24px;right:24px;display:flex;align-items:flex-start;gap:9px}
#zoro-tv-review .zt-header .zt-context{padding-top:9px}
#zoro-tv-review .zt-title{font-size:24px;font-weight:600;letter-spacing:-.6px;line-height:1.2}
#zoro-tv-review .zt-sub{font-size:12px;color:var(--zt-muted);margin-top:5px}
#zoro-tv-review .zt-header-tools{display:flex;gap:4px;margin-left:auto}
#zoro-tv-review .zt-header-tools button{background:#0005}
#zoro-tv-review .zt-transport{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:18px}
#zoro-tv-review .zt-transport button{border-radius:50%;width:54px;height:54px;background:#0005}
#zoro-tv-review .zt-transport .zt-main{width:74px;height:74px;background:#0006}
#zoro-tv-review .zt-main svg{width:30px!important;height:30px!important}
#zoro-tv-review .zt-footer{position:absolute;bottom:20px;left:28px;right:28px}
#zoro-tv-review .zt-title-row{display:flex;align-items:flex-end;gap:16px;margin-bottom:14px}
#zoro-tv-review .zt-title-row .zt-context{flex:1;min-width:0}
#zoro-tv-review .zt-title-row .zt-sub{margin:0 0 5px}
#zoro-tv-review .zt-title-tools{display:flex;gap:5px;align-items:center}
#zoro-tv-review .zt-title-tools button{background:#ffffff12;border:1px solid #ffffff12}
#zoro-tv-review button.zt-demo-focus{background:#fff;color:#0c1713;box-shadow:0 3px 12px #0003}
#zoro-tv-review .zt-progress{display:flex;align-items:center;gap:12px;font-size:11px;font-variant-numeric:tabular-nums}
#zoro-tv-review input[type=range]{width:100%;min-width:30px;height:32px;appearance:none;background:transparent;accent-color:var(--zt-green);cursor:ew-resize;margin:0}
#zoro-tv-review input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--zt-green) 0 var(--zt-progress),#ffffff35 var(--zt-progress) 100%)}
#zoro-tv-review input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:var(--zt-green);margin-top:-4px}
#zoro-tv-review .zt-times{display:flex;justify-content:space-between;color:var(--zt-muted);font-size:12px;font-variant-numeric:tabular-nums}
#zoro-tv-review .zt-under{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:7px}
#zoro-tv-review .zt-under button{padding:7px 10px;font-size:12px}
#zoro-tv-review .zt-hint{font-size:11px;color:#e1e8e4;min-height:16px;text-align:center;margin:0 0 6px}
#zoro-tv-review .zt-native .zt-header .zt-context,#zoro-tv-review .zt-native .zt-header-tools,#zoro-tv-review .zt-native .zt-transport{display:none}
#zoro-tv-review .zt-prepared .zt-title-row{display:none}
#zoro-tv-review .zt-native .zt-under{justify-content:flex-start}
#zoro-tv-review .zt-native .zt-under button{background:#ffffff12;padding-inline:14px}
#zoro-tv-review .zt-native .zt-footer{bottom:22px}
#zoro-tv-review .zt-native input[type=range]{display:block}
#zoro-tv-review .zt-preview{position:absolute;left:33%;bottom:158px;width:144px;background:#152a30;border:2px solid white;border-radius:7px;overflow:hidden;box-shadow:0 8px 25px #0007}
#zoro-tv-review .zt-preview-scene{height:72px;background:radial-gradient(circle at 74% 0,#729796 0 30%,#1c3d4b 31%,#0b222c 65%)}
#zoro-tv-review .zt-preview strong{display:block;text-align:center;padding:6px;font-size:14px;font-variant-numeric:tabular-nums;background:#101a1d}
#zoro-tv-review .zt-preview small{display:block;text-align:center;padding:4px 3px;font-size:10px;background:#101a1d;color:var(--zt-muted)}
#zoro-tv-review .zt-panel{position:absolute;right:26px;bottom:154px;width:330px;max-width:calc(100% - 48px);background:#15201e;box-shadow:0 12px 60px #0009;border:1px solid #ffffff1c;border-radius:14px;padding:16px;z-index:4}
#zoro-tv-review .zt-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#zoro-tv-review .zt-panel-head strong{font-size:16px}
#zoro-tv-review .zt-panel-head button{min-width:32px;min-height:32px;padding:4px}
#zoro-tv-review .zt-columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}
#zoro-tv-review .zt-columns h4{font-size:13px;margin:4px 0 8px;color:var(--zt-muted);font-weight:400}
#zoro-tv-review .zt-columns button{display:flex;width:100%;justify-content:flex-start;text-align:left;font-size:12px;padding:7px 5px;border-radius:6px}
#zoro-tv-review .zt-columns button[aria-pressed=true]{color:var(--zt-green)}
#zoro-tv-review .zt-state-buttons{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}
#zoro-tv-review .zt-state-buttons button{background:light-dark(#e5ece8,#1a2520);color:light-dark(#17281d,#ecf5ed);font-size:12px;padding:8px 14px;min-height:38px}
#zoro-tv-review .zt-state-buttons button[aria-pressed=true]{background:light-dark(#183d29,#c6f3d6);color:light-dark(#fff,#102b19)}
#zoro-tv-review .zt-reference{background:#000;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:24px 0;color:white}
#zoro-tv-review .zt-reference-label{font-size:11px;letter-spacing:1.5px;padding:0 24px;color:#bdc9c2}
#zoro-tv-review .zt-reference img{width:100%;height:auto;display:block}
#zoro-tv-review .zt-reference a{color:#a4e5be;font-size:12px;margin:0 24px}
#zoro-tv-review [hidden]{display:none!important}
@media(max-width:520px){#zoro-tv-review .zt-stage{min-height:485px}#zoro-tv-review .zt-tv{aspect-ratio:auto;min-height:394px}#zoro-tv-review .zt-header{left:12px;right:12px;top:12px}#zoro-tv-review .zt-title{font-size:20px}#zoro-tv-review .zt-header-tools{gap:0}#zoro-tv-review .zt-header-tools button{padding:8px;min-width:40px}#zoro-tv-review .zt-header .zt-title{font-size:17px}#zoro-tv-review .zt-sub{font-size:11px}#zoro-tv-review .zt-footer{left:16px;right:16px;bottom:16px}#zoro-tv-review .zt-title-row{align-items:flex-start;flex-direction:column;gap:10px;margin-bottom:4px}#zoro-tv-review .zt-title-tools{align-self:flex-end;margin-top:-6px}#zoro-tv-review .zt-native .zt-title-tools button{min-width:44px;min-height:40px}#zoro-tv-review .zt-under{gap:4px}#zoro-tv-review .zt-under button{font-size:11px;padding:7px 8px}#zoro-tv-review .zt-preview{bottom:204px;left:36%;width:110px}#zoro-tv-review .zt-preview-scene{height:52px}#zoro-tv-review .zt-panel{right:14px;bottom:151px;max-width:calc(100% - 28px)}#zoro-tv-review .zt-native .zt-panel{bottom:195px}#zoro-tv-review .zt-transport{gap:12px;top:44%}#zoro-tv-review .zt-reference{min-height:458px}}
@media(prefers-reduced-motion:reduce){#zoro-tv-review button{transition:none}}
</style>
<script>
(()=>{
 const root=document.getElementById('zoro-tv-review');
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const button=(name,label,extra='')=>`<button type="button" class="zt-icon ${extra}" aria-label="${label}">${icon(name)}</button>`;
 const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
 root.querySelectorAll('[data-design]').forEach(stage=>{
  const native=stage.dataset.design==='native';
  const state={position:754,draft:null,playing:false,view:'paused',audio:'English',subtitles:'Off'};
  const preferences={green:'#6ce39d',labels:false};
  const context=`<div class="zt-context"><div class="zt-sub">S1 E4 · A New Orbit</div><div class="zt-title">The Long Way Home</div></div>`;
  const tools=`${button('captions','Subtitles','zt-open-tracks')}${button('audio-lines','Audio','zt-open-tracks')}${button('settings-2','Quality','zt-open-quality')}`;
  stage.innerHTML=`<div class="zt-tv ${native?'zt-native':'zt-prepared'}" aria-label="${native?'Apple-inspired concept':'Prepared Zorofin'} paused player"><div class="zt-scene" aria-hidden="true"></div><div class="zt-shade"></div><div class="zt-header">${button('chevron-left','Back')}${context}<div class="zt-header-tools">${button('layers','Episodes')}${button('airplay','AirPlay')}</div></div><div class="zt-transport">${button('rotate-ccw','Back ten seconds','zt-backward')}${button('play','Play','zt-main')}${button('rotate-cw','Forward ten seconds','zt-forward')}</div><div class="zt-preview" hidden><div class="zt-preview-scene"></div><strong>13:04</strong><small>Scene preview · concept</small></div><div class="zt-footer"><div class="zt-title-row">${context}<div class="zt-title-tools">${tools}</div></div><div class="zt-hint" aria-live="polite"></div><div class="zt-progress">${native?'':'<span class="zt-elapsed">12:34</span>'}<input type="range" min="0" max="2700" value="754" aria-label="Preview playback position">${native?'':'<span class="zt-remaining">−32:26</span>'}</div><div class="zt-times" ${native?'':'hidden'}><span class="zt-elapsed">12:34</span><span class="zt-remaining">−32:26</span></div><div class="zt-under">${native?'<button type="button" class="zt-show-info">Info</button><button type="button" class="zt-show-episodes">Episodes</button>':`<button type="button" class="zt-icon zt-open-quality">${icon('settings-2')}<span>Quality</span></button><button type="button" class="zt-icon zt-open-tracks">${icon('captions')}<span>Audio & subtitles</span></button><button type="button" class="zt-icon zt-show-info">${icon('info')}<span>Info</span></button>`}</div></div><div class="zt-panel" hidden><div class="zt-panel-head"><strong>Audio & subtitles</strong>${button('x','Close options','zt-close-panel')}</div><div class="zt-columns"></div></div></div><div class="zt-state-buttons" aria-label="Player preview states"><button type="button" data-state="paused" aria-pressed="true">Paused</button><button type="button" data-state="seek" aria-pressed="false">Seeking</button><button type="button" data-state="options" aria-pressed="false">Audio & subtitles</button></div>`;
  const tv=stage.querySelector('.zt-tv'),range=stage.querySelector('input'),hint=stage.querySelector('.zt-hint');
  function draw(){
   const time=state.draft??state.position;
   tv.style.setProperty('--zt-green',preferences.green);tv.style.setProperty('--zt-progress',`${time/27}%`);
   range.value=time;stage.querySelectorAll('.zt-elapsed').forEach(e=>e.textContent=fmt(time));stage.querySelectorAll('.zt-remaining').forEach(e=>e.textContent='−'+fmt(2700-time));
   const preview=stage.querySelector('.zt-preview');preview.hidden=!(native&&state.draft!==null);preview.querySelector('strong').textContent=fmt(time);
   hint.textContent=state.draft===null?'':(native?'Play to confirm · Back to cancel':`${fmt(time)} · Select to play · Back to cancel`);
   stage.querySelectorAll('[data-state]').forEach(e=>e.setAttribute('aria-pressed',String(e.dataset.state===state.view)));
   const play=stage.querySelector('.zt-main');play.innerHTML=icon(state.playing?'pause':'play');play.setAttribute('aria-label',state.playing?'Pause':'Play');
   stage.querySelectorAll('.zt-under span').forEach(e=>e.hidden=!preferences.labels);
   if(globalThis.lucide)lucide.createIcons();
  }
  function panel(kind){
   state.view='options';state.draft=null;
   stage.querySelector('.zt-panel').hidden=false;
   stage.querySelector('.zt-panel-head strong').textContent=kind==='quality'?'Playback quality':kind==='info'?'Playback info':kind==='episodes'?'Episodes':'Audio & subtitles';
   stage.querySelector('.zt-columns').innerHTML=kind==='tracks'?`<div><h4>Audio</h4>${['English','English · AD'].map(v=>`<button type="button" data-track="audio" data-value="${v}" aria-pressed="${state.audio===v}">${state.audio===v?'✓ ':''}${v}</button>`).join('')}</div><div><h4>Subtitles</h4>${['Off','English (CC)'].map(v=>`<button type="button" data-track="subtitles" data-value="${v}" aria-pressed="${state.subtitles===v}">${state.subtitles===v?'✓ ':''}${v}</button>`).join('')}</div>`:kind==='quality'?'<div><h4>Limit</h4><button type="button">Automatic</button><button type="button">20 Mbps</button></div>':kind==='episodes'?'<div><h4>Season 1</h4><button type="button">4. A New Orbit</button><button type="button">5. Homeward</button></div>':'<div><h4>The Long Way Home</h4><button type="button">1080p · Direct play</button></div>';
   draw();
  }
  stage.addEventListener('click',e=>{
   const b=e.target.closest('button');if(!b)return;
   if(b.dataset.state==='paused'){state.view='paused';state.playing=false;state.draft=null;stage.querySelector('.zt-panel').hidden=true;}
   if(b.dataset.state==='seek'){state.view='seek';state.draft=784;stage.querySelector('.zt-panel').hidden=true;}
   if(b.dataset.state==='options'||b.classList.contains('zt-open-tracks'))panel('tracks');
   if(b.classList.contains('zt-open-quality'))panel('quality');
   if(b.classList.contains('zt-show-info'))panel('info');
   if(b.classList.contains('zt-show-episodes')||b.getAttribute('aria-label')==='Episodes')panel('episodes');
   if(b.classList.contains('zt-close-panel')){stage.querySelector('.zt-panel').hidden=true;state.view='paused';}
   if(b.dataset.track){state[b.dataset.track]=b.dataset.value;panel('tracks');}
   if(b.classList.contains('zt-main')){if(state.draft!==null){state.position=state.draft;state.draft=null;state.playing=true;}else{state.playing=!state.playing;}state.view='paused';}
   if(b.classList.contains('zt-backward')||b.classList.contains('zt-forward')){state.position=Math.max(0,Math.min(2700,state.position+(b.classList.contains('zt-backward')?-10:10)));state.draft=null;state.view='paused';}
   if(b.getAttribute('aria-label')==='Back'){state.draft=null;state.view='paused';stage.querySelector('.zt-panel').hidden=true;}
   draw();
  });
  range.addEventListener('input',()=>{state.draft=Number(range.value);state.view='seek';draw();});
  range.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();state.position=state.draft??state.position;state.draft=null;state.playing=true;state.view='paused';draw();}if(e.key==='Escape'){e.preventDefault();state.draft=null;state.view='paused';draw();}});
  draw();
  if(globalThis.Tweak){const tweak=new Tweak({container:stage,onChange:draw});tweak.addColorPicker(preferences,'green',{label:'Progress accent'});if(!native)tweak.addToggle(preferences,'labels',{label:'Option labels'});}
 });
})();
</script>
